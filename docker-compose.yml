version: "3.9"

services:
  traductor-ia:
    image: ollama/ollama
    container_name: traductor-ia
    ports:
      - "11434:11434"
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traductor-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      - traductor-ia
volumes:
  ollama_models:
