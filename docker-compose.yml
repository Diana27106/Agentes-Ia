version: "3.9"

services:
  traductor-ia:
    image: ollama/ollama:latest
    container_name: traductor-ia
    ports:
      - "11434:11434"
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - traductor-network
    command: serve
      
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traductor-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MAX_TEXT_LENGTH=5000
      - OLLAMA_HOST=http://traductor-ia:11434
      - OLLAMA_MODEL=mistral:latest
    env_file:
      - ./backend/.env
    depends_on:
      traductor-ia:
        condition: service_started
    networks:
      - traductor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traductor-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - traductor-network

volumes:
  ollama_models:

networks:
  traductor-network:
